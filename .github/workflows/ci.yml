name: ci

# Billed per job, each rounded up to whole minutes; a macOS minute costs about ten Linux minutes and
# a Windows minute about two (measured in AGENTS.md: Actions budget). The shape follows from that:
#   - Runs on master by itself (pushes); on any other branch only when started (owner, 2026-11-06):
#     Actions > ci > Run workflow, choosing the branch. A pull request's checks leave out runs
#     started that way (PR #44: green run, required checks still waiting), so such a run posts its
#     results as commit statuses named gate, win-x64, linux-x64, lint and zero-alloc on the commit it tested (job
#     report), which the required checks read: a pull request merges only after a green run of its
#     latest commit.
#   - gate (Linux, seconds; tools/ci/ci-gate.ps1) tells each platform job to run or to skip. A
#     merge to master whose tree a branch run already passed runs nothing (branches must be up to
#     date with master to merge, so the merged tree is the tested one); a branch run whose changes
#     cannot change a result skips every platform job.
#   - The native payload is cached under a key of its inputs and rebuilt only when one of them
#     changes. A rebuilt payload is saved before the tests run, so a red test run keeps it.
#   - Edits that cannot change a result (Markdown, docs/, the other workflows, tools/consume, the
#     interop generator) start no run on master. regen.yml checks the interop layer.
#   - Superseded runs are cancelled. Timeouts sit a few times above the slowest measured job, so a
#     hang costs minutes, not an hour.
#   - macOS is opt-in (hosted macOS arm64 runners are often unavailable for long stretches): a
#     manual run with the macos input, and a weekly run on master. The release builds macOS when a
#     runner is available.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/regen.yml"
      - ".github/workflows/coverage.yml"
      - "tools/consume/**"
      - "tools/generate-native.ps1"
      - "tools/coverage.ps1"
      - "tools/coverage/**"
  workflow_dispatch:
    inputs:
      macos:
        description: "Run the macOS leg too"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC: the macOS leg on master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  VULKAN_SDK_VERSION: "1.4.363.0"   # tools/ci/fetch-vulkan-layer.sh; the layer must know every struct NRI's 1.4.365 headers chain
  MESA_WIN_VERSION: "26.2.6"        # tools/ci/fetch-vulkan-windows.ps1: lavapipe for the Windows leg (mesa-dist-win)
  MESA_WIN_SHA256: "B2E00615FEABA45942343C265CC8C5F576142CA682C1AC6661922D4B72492877"

jobs:
  # full | skip per platform, and the payload cache key; the reasoning is in the run summary.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # runs and caches of this repository
      pull-requests: read    # the pull request a merge commit belongs to
      statuses: write        # a run started by hand marks the required checks pending (job report finishes them)
    outputs:
      key: ${{ steps.gate.outputs.key }}
      win: ${{ steps.gate.outputs.win }}
      linux: ${{ steps.gate.outputs.linux }}
      osx: ${{ steps.gate.outputs.osx }}
    steps:
      # A pull request does not show a run started by hand; pending statuses linking to the run show
      # on it at once that one started and where its progress is
      - name: Mark the required checks pending
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          foreach ($name in 'gate', 'win-x64', 'linux-x64', 'lint', 'zero-alloc') {
              gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context=$name -f description="ci run in progress" -f target_url=$env:RUN_URL --silent
              if ($LASTEXITCODE -ne 0) { throw "posting the pending $name status failed" }
          }

      - uses: actions/checkout@v4

      - name: Decide
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MACOS: ${{ inputs.macos }}
          GATE_REF: ${{ github.ref }}
        run: ./tools/ci/ci-gate.ps1

  win-x64:
    needs: gate
    if: needs.gate.outputs.win != 'skip'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # runtimes/ and runtimes-agility/ exactly as tools/build-native.ps1 stages them.
      - name: Restore native payload
        id: payload
        uses: actions/cache/restore@v4
        with:
          path: |
            runtimes
            runtimes-agility
          key: native-win-x64-${{ needs.gate.outputs.key }}

      - name: Read NRI pin
        if: steps.payload.outputs.cache-hit != 'true'
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      # FetchContent downloads of the Base variant (Agility SDK, NVAPI, AGS, headers). With a
      # matching _deps, build-native.ps1 configures with FETCHCONTENT_FULLY_DISCONNECTED=ON.
      - name: Cache NRI dependencies
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: _build/win-x64-base/_deps
          key: nri-deps-win-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Build native payload
        if: steps.payload.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Configuration Release

      - name: Save native payload
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            runtimes
            runtimes-agility
          key: native-win-x64-${{ needs.gate.outputs.key }}

      # The tests compile a C++ probe against nri/Include with patches/ applied (NativeAbiTests).
      # build-native.ps1 applies them when it builds; a restored payload skipped that.
      - name: Apply patches to nri/
        if: steps.payload.outputs.cache-hit == 'true' && needs.gate.outputs.win == 'full'
        shell: pwsh
        run: ./tools/ci/apply-patches.ps1

      # Vulkan on Windows (owner, 2026-11-06): the runner has no Vulkan driver, so the loader and the
      # validation layer come from the Vulkan SDK of VULKAN_SDK_VERSION and the device is Mesa's
      # lavapipe (tools/ci/fetch-vulkan-windows.ps1), cached per version pair. The tests then run both
      # backends here: D3D12 on WARP, Vulkan on lavapipe.
      - name: Cache Vulkan for Windows
        if: needs.gate.outputs.win == 'full'
        id: vkwin
        uses: actions/cache@v4
        with:
          path: _tools/vk-win
          key: vk-win-${{ env.VULKAN_SDK_VERSION }}-mesa-${{ env.MESA_WIN_VERSION }}

      - name: Fetch Vulkan for Windows
        if: needs.gate.outputs.win == 'full' && steps.vkwin.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/ci/fetch-vulkan-windows.ps1 -Dest _tools/vk-win

      # The runner's processes are elevated, and an elevated process's Vulkan loader ignores
      # VK_DRIVER_FILES and VK_ADD_LAYER_PATH (a loader security rule): with only those, the first run
      # skipped every Vulkan case. So lavapipe and the layer are registered as an installer would,
      # under HKLM\SOFTWARE\Khronos\Vulkan (Drivers, ExplicitLayers); the variables stay for a
      # non-elevated process. The loader directory goes on PATH (NRI loads vulkan-1.dll by name).
      - name: Put Vulkan for Windows in place
        if: needs.gate.outputs.win == 'full'
        shell: pwsh
        run: |
          $vk = Join-Path $env:GITHUB_WORKSPACE '_tools\vk-win'
          $icd = Join-Path $vk 'lvp\lvp_icd.x86_64.json'
          $layer = Join-Path $vk 'layers\VkLayer_khronos_validation.json'
          foreach ($entry in @(@{ Key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'; Json = $icd }, @{ Key = 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers'; Json = $layer })) {
            New-Item -Path $entry.Key -Force | Out-Null
            New-ItemProperty -Path $entry.Key -Name $entry.Json -PropertyType DWord -Value 0 -Force | Out-Null
            Get-Item $entry.Key | Select-Object -ExpandProperty Property | ForEach-Object { "$($entry.Key): $_" }
          }
          Join-Path $vk 'bin' | Add-Content -Path $env:GITHUB_PATH
          "VK_ADD_LAYER_PATH=$(Join-Path $vk 'layers')" | Add-Content -Path $env:GITHUB_ENV
          "VK_DRIVER_FILES=$icd" | Add-Content -Path $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        if: needs.gate.outputs.win == 'full'
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build managed
        if: needs.gate.outputs.win == 'full'
        run: dotnet build SharpNRI.slnx -c Release

      # Which adapter each backend gets, or why it is unavailable (the suite skips a backend by that
      # reason, which the test summary does not print).
      - name: Test adapters
        if: needs.gate.outputs.win == 'full'
        shell: pwsh
        env:
          SHARPNRI_TEST_CHILD: test-adapters
        run: |
          & tests/SharpNRI.Tests/bin/Release/net11.0/SharpNRI.Tests.exe
          $global:LASTEXITCODE = 0

      - name: Test
        if: needs.gate.outputs.win == 'full'
        run: dotnet test --solution SharpNRI.slnx -c Release --no-build

  linux-x64:
    needs: gate
    if: needs.gate.outputs.linux != 'skip'
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19, whose loader is 1.4. The suite is
    # measured on 24.04's stock 1.3 loader, the pairing patches/0004 exists for (AGENTS.md: Vulkan
    # loader and validation layers). Moving is a decision, not an image update.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Packages come from the runner image's package lists, without the up-front "apt-get update":
      # the lists are almost always current, and the refresh alone took minutes on a slow mirror
      # (2026-11-06). Only an install that fails on a stale list refreshes them and retries. The
      # validation layer is not Ubuntu's (1.3.275, too old): "Fetch Khronos validation layer" below.
      # Tests: the Vulkan loader, lavapipe (software ICD) and vulkaninfo for the device summary.
      - name: Install test packages
        if: needs.gate.outputs.linux == 'full'
        run: |
          apt_install() {
            sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" ||
              { sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
                sudo apt-get install -y -qq --no-install-recommends "$@"; }
          }
          apt_install libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Restore native payload
        id: payload
        uses: actions/cache/restore@v4
        with:
          path: runtimes
          key: native-linux-x64-${{ needs.gate.outputs.key }}

      - name: Read NRI pin
        if: steps.payload.outputs.cache-hit != 'true'
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-base/_deps
          key: nri-deps-linux-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      # Only for a build: clang and Ninja, and libx11-dev / libwayland-dev, because NRI enables its
      # X11 / Wayland swap chain paths when it finds the headers, so a CI payload equals a release one.
      - name: Install build packages
        if: steps.payload.outputs.cache-hit != 'true'
        run: |
          apt_install() {
            sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" ||
              { sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
                sudo apt-get install -y -qq --no-install-recommends "$@"; }
          }
          apt_install ninja-build clang libx11-dev libwayland-dev

      - name: Build native payload
        if: steps.payload.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Configuration Release

      - name: Save native payload
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtimes
          key: native-linux-x64-${{ needs.gate.outputs.key }}

      - name: Apply patches to nri/
        if: steps.payload.outputs.cache-hit == 'true' && needs.gate.outputs.linux == 'full'
        shell: pwsh
        run: ./tools/ci/apply-patches.ps1

      # The Khronos validation layer that matches NRI's Vulkan headers. Ubuntu's package is 1.3.275
      # and reports every 1.4-era struct NRI chains as an ERROR; LunarG's apt packages stop at
      # 1.4.313. tools/ci/fetch-vulkan-layer.sh takes the layer out of the SDK tarball. The loader
      # stays the distribution's 1.3 one on purpose: patches/0004 is for exactly that pairing.
      - name: Cache Khronos validation layer
        if: needs.gate.outputs.linux == 'full'
        id: vvl
        uses: actions/cache@v4
        with:
          path: _tools/vvl
          key: vvl-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Fetch Khronos validation layer
        if: needs.gate.outputs.linux == 'full' && steps.vvl.outputs.cache-hit != 'true'
        run: bash tools/ci/fetch-vulkan-layer.sh _tools/vvl

      - name: Put the layer in front of the system one
        if: needs.gate.outputs.linux == 'full'
        run: echo "VK_ADD_LAYER_PATH=$GITHUB_WORKSPACE/_tools/vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # What the tests actually run on. Runner hosts differ (one host passed the ray query test,
      # the next failed it with the same packages), and lavapipe JIT-compiles for the host CPU.
      - name: Vulkan device and host CPU
        if: needs.gate.outputs.linux == 'full'
        run: |
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverInfo|driverVersion|apiVersion" || true
          lscpu | grep -m1 "Model name"
          echo "nproc: $(nproc)"
          grep -o -m1 -w avx512f /proc/cpuinfo || echo "no avx512f"

      - uses: actions/setup-dotnet@v4
        if: needs.gate.outputs.linux == 'full'
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build managed
        if: needs.gate.outputs.linux == 'full'
        run: dotnet build SharpNRI.slnx -c Release

      # The "intermittent ray query miss" was NRI's 5 s fence-wait timeout: lavapipe JIT-compiles
      # its shaders while it executes the command buffer, which with a cold Mesa shader cache on a
      # loaded runner can pass 5 s; Wait then returns with only an ERROR message, and the test read a
      # readback nothing had written yet (AGENTS.md: CI runners and flakes, item 1). The tests now wait
      # on the fence value (GpuWork.Wait). This step runs the ray tracing classes with the shader
      # cache off, so every run JIT-compiles everything, and prints how long each wait took.
      # Synchronization validation is on here and in the Test step: a hazard is a layer ERROR,
      # which the tests' message assertions fail on.
      - name: Ray tracing, cold shader cache
        if: needs.gate.outputs.linux == 'full'
        env:
          MESA_SHADER_CACHE_DISABLE: "true"
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "1"
          VK_KHRONOS_VALIDATION_SYNCVAL_SHADER_ACCESSES_HEURISTIC: "1"
        run: |
          t=tests/SharpNRI.Tests/bin/Release/net11.0/SharpNRI.Tests
          $t -noColor -showLiveOutput -class SharpNRI.Tests.RayTracingTests -class SharpNRI.Tests.RayTracingPipelineTests

      # A SIGSEGV in the test host (seen once, exit 139 after 106 tests, 0 failed) loses the buffered
      # test list, so the crashing test cannot be read from the log (AGENTS.md: CI runners and
      # flakes). createdump writes a minidump on the signal; the step after prints every thread's
      # managed and native stack from it, which names the test and the native frame.
      - name: Test
        if: needs.gate.outputs.linux == 'full'
        env:
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "1"
          DOTNET_DbgMiniDumpName: /tmp/dumps/testhost-%p.dmp
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "1"
          VK_KHRONOS_VALIDATION_SYNCVAL_SHADER_ACCESSES_HEURISTIC: "1"
        run: |
          mkdir -p /tmp/dumps
          # Detailed output lists passed tests as they finish; the default lists only skips and
          # failures, which is why two crashes at "106 completed" could not be placed.
          dotnet test --solution SharpNRI.slnx -c Release --no-build --output Detailed

      - name: Crash stacks
        if: failure()
        run: |
          ls /tmp/dumps/*.dmp >/dev/null 2>&1 || { echo "no minidump: the test host did not crash"; exit 0; }
          dotnet tool install -g dotnet-dump >/dev/null
          for d in /tmp/dumps/*.dmp; do
            echo "== $d"
            "$HOME/.dotnet/tools/dotnet-dump" analyze "$d" -c "clrstack -all -f" -c "exit" | head -400
          done

      - name: Keep the minidumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-minidumps
          path: /tmp/dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 14

  # The most expensive minutes: with the payload cached this job fits in one billed minute.
  osx-arm64:
    needs: gate
    if: needs.gate.outputs.osx != 'skip'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore native payload
        id: payload
        uses: actions/cache/restore@v4
        with:
          path: runtimes
          key: native-osx-arm64-${{ needs.gate.outputs.key }}

      # Vulkan on macOS is MoltenVK behind the Khronos loader, with the Khronos validation layer;
      # vulkan-tools only for the vulkaninfo summary below. NRI's Metal backend is off
      # (build-native.ps1), so Xcode's Metal toolchain is not needed, and the native build itself
      # needs only Ninja: the Vulkan headers come through NRI's FetchContent and the loader is not
      # linked (patches/0007).
      - name: Install system packages
        if: needs.gate.outputs.osx == 'full'
        run: brew install molten-vk vulkan-loader vulkan-validationlayers vulkan-tools

      - name: Install Ninja
        if: steps.payload.outputs.cache-hit != 'true'
        run: brew install ninja

      # Homebrew's prefix (/opt/homebrew) is on none of dyld's default paths: NRI and Vortice
      # dlopen libvulkan.1.dylib by name, so dyld is told where it is. The loader is pointed at
      # MoltenVK's ICD manifest alone, so that no other driver on the image can be picked up;
      # it finds the validation layer in $(brew --prefix)/share/vulkan/explicit_layer.d by itself.
      - name: Point dyld and the Vulkan loader at Homebrew
        if: needs.gate.outputs.osx == 'full'
        run: |
          icd="$(find "$(brew --prefix molten-vk)/" -name MoltenVK_icd.json | head -n1)"
          test -n "$icd" || { echo "MoltenVK_icd.json not found under $(brew --prefix molten-vk)"; exit 1; }
          {
            echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
            echo "VK_DRIVER_FILES=$icd"
          } >> "$GITHUB_ENV"

      # What the tests actually run on, as on Linux: the runner host's GPU is paravirtualised and
      # MoltenVK translates to whatever Metal that host offers.
      - name: Vulkan device and host CPU
        if: needs.gate.outputs.osx == 'full'
        run: |
          sysctl -n machdep.cpu.brand_string hw.model || true
          sw_vers || true
          brew list --versions molten-vk vulkan-loader vulkan-validationlayers cmake || true
          cmake --version | head -n1
          echo "ICD: $VK_DRIVER_FILES"
          grep -E '"(api_version|implementation_version|library_path)"' "$(brew --prefix)/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" || true
          vulkaninfo --summary || true
          vulkaninfo 2>/dev/null | grep -E "maxSamplerLodBias|samplerMipLodBias|hostImageCopy|timestampValidBits|timestampComputeAndGraphics|timestampPeriod|VK_KHR_external_(memory|semaphore)|VK_EXT_external_memory_metal" || true

      - name: Read NRI pin
        if: steps.payload.outputs.cache-hit != 'true'
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: _build/osx-arm64-base/_deps
          key: nri-deps-osx-arm64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Build native payload
        if: steps.payload.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid osx-arm64 -Configuration Release

      - name: Save native payload
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtimes
          key: native-osx-arm64-${{ needs.gate.outputs.key }}

      - name: Apply patches to nri/
        if: steps.payload.outputs.cache-hit == 'true' && needs.gate.outputs.osx == 'full'
        shell: pwsh
        run: ./tools/ci/apply-patches.ps1

      - uses: actions/setup-dotnet@v4
        if: needs.gate.outputs.osx == 'full'
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build managed
        if: needs.gate.outputs.osx == 'full'
        run: dotnet build SharpNRI.slnx -c Release

      # Detailed: every skip and its reason in the log, which is what this leg is measured by.
      - name: Test
        if: needs.gate.outputs.osx == 'full'
        run: dotnet test --solution SharpNRI.slnx -c Release --no-build --output Detailed

  # Lint: the SDK's analyzers and code-style rules (.editorconfig, Directory.Build.props) over every
  # C# file, generated dotnet/Native included, as errors; and the formatter's verdict on everything
  # hand-written. No native payload: the build only compiles (SharpNRIRequireNative=false).
  lint:
    needs: gate
    if: needs.gate.outputs.linux != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Analyzers, warnings as errors
        run: dotnet build SharpNRI.slnx -c Release -warnaserror -p:SharpNRIRequireNative=false

      - name: Formatting
        run: dotnet format whitespace SharpNRI.slnx --exclude dotnet/Native --verify-no-changes --verbosity diagnostic

  # Zero allocation: every per-frame call of the binding, measured (AllocationTests,
  # ExtensionAllocationTests) and held to the whole public surface (AllocationCoverageTests). On
  # NONE and lavapipe, after linux-x64, whose native payload it restores from the cache (saved
  # before linux-x64's tests, so it is there whatever they found).
  zero-alloc:
    needs: [gate, linux-x64]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.linux != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install test packages
        run: |
          sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 libvulkan1 mesa-vulkan-drivers ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvulkan1 mesa-vulkan-drivers; }

      - name: Restore native payload
        id: payload
        uses: actions/cache/restore@v4
        with:
          path: runtimes
          key: native-linux-x64-${{ needs.gate.outputs.key }}
          fail-on-cache-miss: true   # linux-x64 builds and saves it; a miss means its native build failed

      - name: Cache Khronos validation layer
        id: vvl
        uses: actions/cache@v4
        with:
          path: _tools/vvl
          key: vvl-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Fetch Khronos validation layer
        if: steps.vvl.outputs.cache-hit != 'true'
        run: bash tools/ci/fetch-vulkan-layer.sh _tools/vvl

      - name: Put the layer in front of the system one
        run: echo "VK_ADD_LAYER_PATH=$GITHUB_WORKSPACE/_tools/vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build managed
        run: dotnet build tests/SharpNRI.Tests -c Release

      - name: Zero-allocation frames
        run: |
          tests/SharpNRI.Tests/bin/Release/net11.0/SharpNRI.Tests -noColor -showLiveOutput \
            -class SharpNRI.Tests.AllocationTests -class SharpNRI.Tests.ExtensionAllocationTests -class SharpNRI.Tests.AllocationCoverageTests

  # A run started by hand is left out of a pull request's checks, so it posts the required checks'
  # results as commit statuses on the commit it tested. A platform job skipped by the gate's decision
  # passes, as a skipped check does; anything else that is not success fails, and when the gate
  # itself did not succeed every status fails (its skipped jobs prove nothing).
  report:
    needs: [gate, win-x64, linux-x64, lint, zero-alloc]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the results as commit statuses
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $needs = $env:NEEDS | ConvertFrom-Json
          $gateOk = $needs.gate.result -eq 'success'
          foreach ($name in 'gate', 'win-x64', 'linux-x64', 'lint', 'zero-alloc') {
              $result = $needs.$name.result
              $state = if ($gateOk -and ($result -eq 'success' -or ($result -eq 'skipped' -and $name -ne 'gate'))) { 'success' } else { 'failure' }
              gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=$state -f context=$name -f description="ci run: $result" -f target_url=$env:RUN_URL --silent
              if ($LASTEXITCODE -ne 0) { throw "posting the $name status failed" }
              "$name -> $state ($result)"
          }
