name: ci

# Deliberately small: four jobs, no matrix explosion, superseded runs are cancelled, and the
# multi-GB NRI dependency downloads are cached once per (NRI version, patches) pair.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  VULKAN_SDK_VERSION: "1.4.363.0"   # tools/ci/fetch-vulkan-layer.sh; the layer must know every struct NRI's 1.4.365 headers chain

jobs:
  win-x64:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      # FetchContent downloads of the Base variant (Agility SDK, NVAPI, AGS, headers). With a
      # matching _deps, build-native.ps1 configures with FETCHCONTENT_FULLY_DISCONNECTED=ON.
      - name: Cache NRI dependencies
        uses: actions/cache@v4
        with:
          path: _build/win-x64-base/_deps
          key: nri-deps-win-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Configuration Release

      - name: Build managed
        run: dotnet build PrismNRI.slnx -c Release

      - name: Test
        run: dotnet test --solution PrismNRI.slnx -c Release --no-build

  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Vulkan loader + lavapipe (software ICD) + Khronos validation layer for the tests.
      # libx11-dev / libwayland-dev: NRI enables its X11 / Wayland swapchain paths when it finds the
      # headers; installing them keeps the CI payload identical to a release payload.
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build clang libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libx11-dev libwayland-dev

      # The Khronos validation layer that matches NRI's Vulkan headers. Ubuntu's package is 1.3.275
      # and reports every 1.4-era struct NRI chains as an ERROR; LunarG's apt packages stop at
      # 1.4.313. tools/ci/fetch-vulkan-layer.sh takes the layer out of the SDK tarball. The loader
      # stays the distribution's 1.3 one on purpose: patches/0004 is for exactly that pairing.
      - name: Cache Khronos validation layer
        id: vvl
        uses: actions/cache@v4
        with:
          path: _tools/vvl
          key: vvl-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Fetch Khronos validation layer
        if: steps.vvl.outputs.cache-hit != 'true'
        run: bash tools/ci/fetch-vulkan-layer.sh _tools/vvl

      - name: Put the layer in front of the system one
        run: echo "VK_ADD_LAYER_PATH=$GITHUB_WORKSPACE/_tools/vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # What the tests actually run on. Runner hosts differ (one host passed the ray query test,
      # the next failed it with the same packages), and lavapipe JIT-compiles for the host CPU.
      - name: Vulkan device and host CPU
        run: |
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverInfo|driverVersion|apiVersion" || true
          lscpu | grep -m1 "Model name"
          grep -o -m1 -w avx512f /proc/cpuinfo || echo "no avx512f"

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-base/_deps
          key: nri-deps-linux-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Configuration Release

      - name: Build managed
        run: dotnet build PrismNRI.slnx -c Release

      # lavapipe's ray query misses the triangle on some runs and hits it on others, same packages,
      # same CPU model (CLAUDE.md: CI runners and flakes). The test records and skips on a software adapter; this step
      # runs it on its own five times first so the run leaves its hit maps in the log.
      - name: Ray query probe
        continue-on-error: true
        run: |
          t=tests/PrismNRI.Tests/bin/Release/net11.0/PrismNRI.Tests
          pass=0
          for i in 1 2 3 4 5; do
            if $t -method "PrismNRI.Tests.RayTracingTests.A_ray_query_hits_the_triangle_in_a_built_TLAS" > /tmp/rq.log 2>&1; then pass=$((pass+1)); else grep -v "^\s*$" /tmp/rq.log | head -60; fi
          done
          echo "ray query: $pass of 5 runs passed"

      - name: Test
        run: dotnet test --solution PrismNRI.slnx -c Release --no-build

  osx-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Vulkan on macOS is MoltenVK behind the Khronos loader, with the Khronos validation layer;
      # vulkan-tools only for the vulkaninfo summary below. NRI's Metal backend is off
      # (build-native.ps1), so Xcode's Metal toolchain is not needed.
      - name: Install system packages
        run: brew install ninja molten-vk vulkan-loader vulkan-validationlayers vulkan-tools

      # Homebrew's prefix (/opt/homebrew) is on none of dyld's default paths: NRI and Vortice
      # dlopen libvulkan.1.dylib by name, so dyld is told where it is. The loader is pointed at
      # MoltenVK's ICD manifest alone, so that no other driver on the image can be picked up;
      # it finds the validation layer in $(brew --prefix)/share/vulkan/explicit_layer.d by itself.
      - name: Point dyld and the Vulkan loader at Homebrew
        run: |
          icd="$(find "$(brew --prefix molten-vk)/" -name MoltenVK_icd.json | head -n1)"
          test -n "$icd" || { echo "MoltenVK_icd.json not found under $(brew --prefix molten-vk)"; exit 1; }
          {
            echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
            echo "VK_DRIVER_FILES=$icd"
          } >> "$GITHUB_ENV"

      # What the tests actually run on, as on Linux: the runner host's GPU is paravirtualised and
      # MoltenVK translates to whatever Metal that host offers.
      - name: Vulkan device and host CPU
        run: |
          sysctl -n machdep.cpu.brand_string hw.model || true
          sw_vers || true
          brew list --versions molten-vk vulkan-loader vulkan-validationlayers cmake || true
          cmake --version | head -n1
          echo "ICD: $VK_DRIVER_FILES"
          cat "$(brew --prefix)/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" | grep -E '"(api_version|implementation_version|library_path)"' || true
          vulkaninfo --summary || true
          vulkaninfo 2>/dev/null | grep -E "maxSamplerLodBias|samplerMipLodBias|hostImageCopy|timestampValidBits|timestampComputeAndGraphics|timestampPeriod|VK_KHR_external_(memory|semaphore)|VK_EXT_external_memory_metal" || true

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        uses: actions/cache@v4
        with:
          path: _build/osx-arm64-base/_deps
          key: nri-deps-osx-arm64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid osx-arm64 -Configuration Release

      - name: Build managed
        run: dotnet build PrismNRI.slnx -c Release

      # Detailed: every skip and its reason in the log, which is what this leg is measured by.
      - name: Test
        run: dotnet test --solution PrismNRI.slnx -c Release --no-build --output Detailed

  # The checked-in L0 layer must be exactly what the pinned headers generate. The generator writes
  # LF whatever the host, so any runner compares equal; Windows is where ClangSharp is exercised
  # for releases.
  regen:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          # ClangSharpPInvokeGenerator 21.1.8.4 targets net10.0.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install ClangSharpPInvokeGenerator
        shell: pwsh
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --version 21.1.8.4
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Regenerate
        shell: pwsh
        run: ./tools/generate-native.ps1

      - name: Fail on drift
        shell: pwsh
        run: |
          # git status alone is not the test: with core.autocrlf on the Windows runner it reports
          # the regenerated files as modified on line endings while their content is unchanged.
          # Re-adding runs the clean filter, so diff --cached compares content.
          git add -A -- dotnet/Native
          git --no-pager diff --cached --stat -- dotnet/Native
          git diff --cached --quiet -- dotnet/Native
          if ($LASTEXITCODE -ne 0) {
            git --no-pager diff --cached -- dotnet/Native | Select-Object -First 120
            throw "dotnet/Native is out of date with the pinned NRI headers. Run tools/generate-native.ps1 and commit."
          }
