name: release

# How a release is made:
#   1. Bump <Version> in dotnet/SharpNRI.csproj and, to the same value, in descs/SharpNRI.Descs.csproj,
#      testing/SharpNRI.Testing.csproj and native/SharpNRI.Native.Upscalers.csproj. Add
#      docs/releases/v<Version>.md, the release body (NRI pin, changes, breaking changes, verified
#      hardware and commit, coverage link). Merge to master and let ci go green.
#   2. git tag v<Version> && git push origin v<Version>     (e.g. v1.0.0-beta.1)
#   3. This workflow: version (tag == v<Version> in all four csprojs, else fail) -> win-x64, linux-x64,
#      osx-arm64 (native payloads, same setup and build-native.ps1 calls as ci.yml) -> pack (all RIDs
#      into one set of .nupkg files, contents listed and checked) -> consume (tools/consume restores
#      the packages from a folder feed and creates devices on windows and ubuntu; consume-macos on
#      macos) -> release (GitHub release with the .nupkg files and one zip per native payload;
#      prerelease when the tag contains '-'). macOS is optional: without a macOS runner the release
#      ships without osx-arm64, and its body says so.
#   No dry run before tagging: a tag run that fails publishes nothing (release needs consume), and a
#   dry run repeats every job of the tag run. After a failure: fix through a pull request, then move
#   the tag (git tag -f v<Version> <commit>; git push -f origin v<Version>), or use "Re-run failed
#   jobs" when the cause was outside the repository; it keeps the jobs that passed.
#   Dry run (Actions > release > Run workflow, tag=v<Version>): only to try a change to this file.
#   It builds, packs, runs consume, uploads artifacts and creates no release.
#   Nothing is pushed to NuGet.org (see the commented step in the release job).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to name the build after (v + <Version> in dotnet/SharpNRI.csproj). Dry run: no release is created."
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Fails in seconds, before the native builds, when the tag and the package versions disagree.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag equals v<Version>
        id: check
        shell: pwsh
        run: |
          $projects = "dotnet/SharpNRI.csproj", "descs/SharpNRI.Descs.csproj", "testing/SharpNRI.Testing.csproj",
                      "native/SharpNRI.Native.Upscalers.csproj"
          $versions = foreach ($p in $projects) {
            if ((Get-Content $p -Raw) -notmatch '<Version>([^<]+)</Version>') { throw "<Version> not found in $p" }
            [pscustomobject]@{ Project = $p; Version = $Matches[1].Trim() }
          }
          $versions | Format-Table -AutoSize | Out-String | Write-Host
          $version = $versions[0].Version
          $odd = @($versions | Where-Object Version -ne $version)
          if ($odd) { throw "package versions disagree: $(($odd | ForEach-Object { "$($_.Project)=$($_.Version)" }) -join ', ') vs dotnet/SharpNRI.csproj=$version" }
          if ($env:RELEASE_TAG -cne "v$version") { throw "tag '$env:RELEASE_TAG' is not 'v$version' (<Version> in dotnet/SharpNRI.csproj)" }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) { throw "release notes $notes missing: add them in the version-bump pull request" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "release $env:RELEASE_TAG, packages $version"

  # Base + Upscalers. The Agility runtime build-native.ps1 also stages is for the repository's tests
  # only: no package or zip carries it (applications take Microsoft.Direct3D.D3D12).
  win-x64:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies (Base)
        uses: actions/cache@v4
        with:
          path: _build/win-x64-base/_deps
          key: nri-deps-win-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Cache NRI dependencies (Upscalers)
        uses: actions/cache@v4
        with:
          path: _build/win-x64-upscalers/_deps
          key: nri-deps-win-x64-upscalers-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload (Base)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Configuration Release

      - name: Build native payload (Upscalers)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Variant Upscalers -Configuration Release

      - name: Zip payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($v in @(@{ Name = "base"; Dir = "runtimes" }, @{ Name = "upscalers"; Dir = "runtimes-upscalers" })) {
            $src = "$($v.Dir)/win-x64/native"
            if (-not (Test-Path $src)) { throw "$src was not staged" }
            # ZipFile writes '/' separators; the zip unpacks the same on every OS.
            [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $src).Path, "$PWD/dist/SharpNRI-native-$($v.Name)-win-x64-$env:RELEASE_TAG.zip")
          }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-win-x64
          path: runtimes/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-upscalers-win-x64
          path: runtimes-upscalers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zips-win-x64
          path: dist/*.zip
          if-no-files-found: error

  # Base + Upscalers. On Linux the Upscalers variant is NIS only: FFX and XeSS are Windows-only in
  # NRI, NGX is off without -WithDlss (build-native.ps1).
  linux-x64:
    needs: version
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19, and libNRI.so built there would need
    # its newer glibc, silently dropping every older distribution. Raising the floor is a decision.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # As ci.yml. libx11-dev / libwayland-dev decide NRI's X11 / Wayland swapchain paths, so the
      # release payload is the one CI tested. The test-only validation layer fetch is not needed.
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build clang libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libx11-dev libwayland-dev

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies (Base)
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-base/_deps
          key: nri-deps-linux-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Cache NRI dependencies (Upscalers)
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-upscalers/_deps
          key: nri-deps-linux-x64-upscalers-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload (Base)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Configuration Release

      - name: Build native payload (Upscalers)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Variant Upscalers -Configuration Release

      # Log only: what the shipped libraries need from the system at load time.
      - name: Library dependencies
        run: |
          for f in runtimes/linux-x64/native/libNRI.so runtimes-upscalers/linux-x64/native/libNRI.so; do
            echo "== $f"
            readelf -d "$f" | grep -E "NEEDED|SONAME|RUNPATH|RPATH" || true
          done

      - name: Zip payloads
        run: |
          mkdir -p dist
          (cd runtimes/linux-x64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-base-linux-x64-$RELEASE_TAG.zip" .)
          (cd runtimes-upscalers/linux-x64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-upscalers-linux-x64-$RELEASE_TAG.zip" .)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-linux-x64
          path: runtimes/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-upscalers-linux-x64
          path: runtimes-upscalers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zips-linux-x64
          path: dist/*.zip
          if-no-files-found: error

  # Base only: build-native.ps1 refuses Upscalers on macOS. Metal OFF, loader not linked, deployment
  # target 15.0, all passed by the script; its otool check fails the build on a foreign link.
  osx-arm64:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system packages
        run: brew install ninja molten-vk vulkan-loader vulkan-validationlayers vulkan-tools

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        uses: actions/cache@v4
        with:
          path: _build/osx-arm64-base/_deps
          key: nri-deps-osx-arm64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid osx-arm64 -Configuration Release

      - name: Zip payload
        run: |
          mkdir -p dist
          (cd runtimes/osx-arm64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-base-osx-arm64-$RELEASE_TAG.zip" .)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-osx-arm64
          path: runtimes/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zips-osx-arm64
          path: dist/*.zip
          if-no-files-found: error

  # One pack with every RID present. dotnet/SharpNRI.csproj packs runtimes/<host rid>/native through
  # its Content item and every other runtimes/** file through its None item (the host RID excluded),
  # both under runtimes/<rid>/native, so the host OS does not matter. The native/ packaging projects
  # pack runtimes-upscalers/** whole.
  #
  # macOS is optional: hosted macOS arm64 runners are often unavailable for hours, so pack does not
  # wait for osx-arm64 to succeed. When that job did not succeed (no runner, cancelled), the
  # packages carry no osx-arm64 library and the release body says so.
  pack:
    needs: [version, win-x64, linux-x64, osx-arm64]
    if: always() && needs.version.result == 'success' && needs.win-x64.result == 'success' && needs.linux-x64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.layout.outputs.macos }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - uses: actions/download-artifact@v4
        with:
          pattern: runtimes-*
          path: _artifacts

      # Artifact runtimes[-upscalers]-<rid> holds <rid>/native/...; it goes back under the
      # staging root it was uploaded from.
      - name: Lay out the staging directories
        id: layout
        shell: pwsh
        env:
          OSX_RESULT: ${{ needs.osx-arm64.result }}
        run: |
          $rids = "win-x64", "linux-x64", "osx-arm64"
          foreach ($a in Get-ChildItem _artifacts -Directory) {
            $rid = $rids | Where-Object { $a.Name.EndsWith("-$_") } | Select-Object -First 1
            if (-not $rid) { throw "unexpected artifact $($a.Name)" }
            $root = $a.Name.Substring(0, $a.Name.Length - $rid.Length - 1)
            if ($root -notin "runtimes", "runtimes-upscalers") { throw "unexpected artifact $($a.Name)" }
            if (-not (Test-Path "$($a.FullName)/$rid/native")) { throw "$($a.Name) has no $rid/native" }
            New-Item -ItemType Directory -Force $root | Out-Null
            Copy-Item "$($a.FullName)/$rid" $root -Recurse
            Write-Host "$($a.Name) -> $root/$rid/native"
          }
          $expected = "runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so",
                      "runtimes-upscalers/win-x64/native/NRI.dll", "runtimes-upscalers/linux-x64/native/libNRI.so"
          # osx-arm64 is in the packages exactly when its job succeeded.
          $macos = $env:OSX_RESULT -eq 'success'
          if ($macos) { $expected += "runtimes/osx-arm64/native/libNRI.dylib" }
          else {
            # A job that failed after uploading must not leave its payload in the packages.
            if (Test-Path runtimes/osx-arm64) { Remove-Item -Recurse -Force runtimes/osx-arm64 }
            Write-Warning "osx-arm64 job result '$env:OSX_RESULT': the packages carry no macOS library"
          }
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "missing after download: $($missing -join ', ')" }
          "macos=$($macos.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack SharpNRI.slnx -c Release -p:PackageOutputPath="$GITHUB_WORKSPACE/nupkg"

      - name: Package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $must = @{
            "SharpNRI"                  = @("runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so", "lib/net11.0/SharpNRI.dll") +
                                          @(if ("${{ steps.layout.outputs.macos }}" -eq 'true') { "runtimes/osx-arm64/native/libNRI.dylib" })
            "SharpNRI.Descs"            = @("lib/net11.0/SharpNRI.Descs.dll")
            "SharpNRI.Testing"          = @("lib/net11.0/SharpNRI.Testing.dll")
            "SharpNRI.Native.Upscalers" = "runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so"
          }
          $version = "${{ needs.version.outputs.version }}"
          $failed = @()
          foreach ($id in $must.Keys | Sort-Object) {
            $pkg = "nupkg/$id.$version.nupkg"
            if (-not (Test-Path $pkg)) { $failed += "$pkg not produced"; continue }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $pkg))
            try {
              $entries = @($zip.Entries | ForEach-Object { $_.FullName })
              Write-Host "`n==> $pkg ($([math]::Round((Get-Item $pkg).Length / 1KB)) KB)"
              $zip.Entries | Sort-Object FullName | ForEach-Object { Write-Host ("    {0,12}  {1}" -f $_.Length, $_.FullName) }
              foreach ($e in $must[$id]) { if ($entries -notcontains $e) { $failed += "$pkg lacks $e" } }
            } finally { $zip.Dispose() }
          }
          $extra = @(Get-ChildItem nupkg -Filter *.nupkg | Where-Object { $_.Name -notin ($must.Keys | ForEach-Object { "$_.$version.nupkg" }) })
          foreach ($x in $extra) { Write-Warning "unexpected package $($x.Name)" }
          if ($failed) { throw "package check failed:`n  $($failed -join "`n  ")" }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  # The packages as an outside project sees them: tools/consume restores SharpNRI and
  # SharpNRI.Testing from nupkg/ by PackageReference and creates NONE plus a validated GPU device
  # (WARP, lavapipe, MoltenVK) with a buffer and a fence. Only what a consumer needs for a software
  # device is installed; no validation layer, no build tools. The first run is the portable build
  # (runtimes/<rid>/native through the deps.json), the second the RID-specific one (flat copy).
  consume:
    needs: [version, pack]
    # always(): pack ran although osx-arm64, an ancestor, may have been cancelled.
    if: always() && needs.pack.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SHARPNRI_FEED: ${{ github.workspace }}/nupkg
      SHARPNRI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Vulkan loader + lavapipe (software ICD).
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      # bash on every runner, as ci.yml's test steps: the DYLD_* variable reaches dotnet the same way.
      - name: Build the consumer
        shell: bash
        run: |
          ls -l nupkg
          dotnet build tools/consume -c Release -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

      - name: Run (portable build)
        shell: bash
        run: dotnet tools/consume/bin/Release/net11.0/SharpNRI.Consume.dll

      - name: Run (-r ${{ matrix.rid }})
        shell: bash
        run: dotnet run --project tools/consume -c Release -r ${{ matrix.rid }} -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

  # The macOS smoke test, when the packages carry the osx-arm64 library. Optional like the build:
  # the release does not wait for a runner, and only a run that fails blocks it.
  consume-macos:
    needs: [version, pack]
    if: always() && needs.pack.result == 'success' && needs.pack.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      SHARPNRI_FEED: ${{ github.workspace }}/nupkg
      SHARPNRI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # MoltenVK behind the Khronos loader, found as in ci.yml.
      - name: Install system packages
        run: brew install molten-vk vulkan-loader

      - name: Point dyld and the Vulkan loader at Homebrew
        run: |
          icd="$(find "$(brew --prefix molten-vk)/" -name MoltenVK_icd.json | head -n1)"
          test -n "$icd" || { echo "MoltenVK_icd.json not found under $(brew --prefix molten-vk)"; exit 1; }
          {
            echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
            echo "VK_DRIVER_FILES=$icd"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Build the consumer
        run: |
          ls -l nupkg
          dotnet build tools/consume -c Release -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

      - name: Run (portable build)
        run: dotnet tools/consume/bin/Release/net11.0/SharpNRI.Consume.dll

      - name: Run (-r osx-arm64)
        run: dotnet run --project tools/consume -c Release -r osx-arm64 -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

  release:
    needs: [version, pack, consume, consume-macos]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.pack.result == 'success' && needs.consume.result == 'success' && needs.consume-macos.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      # docs/releases/<tag>.md, plus one line when macOS did not make it into the release.
      - name: Release body
        env:
          MACOS: ${{ needs.pack.outputs.macos }}
          MACOS_SMOKE: ${{ needs.consume-macos.result }}
        run: |
          cp "docs/releases/${GITHUB_REF_NAME}.md" body.md
          if [ "$MACOS" != "true" ]; then
            printf '\nThis release has no macOS (osx-arm64) library: no macOS runner was available when it was built.\n' >> body.md
          elif [ "$MACOS_SMOKE" != "success" ]; then
            printf '\nThe macOS (osx-arm64) library was built, but its package smoke test did not run: no macOS runner was available.\n' >> body.md
          fi
          cat body.md

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: zips-*
          path: dist
          merge-multiple: true

      - name: Release assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SharpNRI ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: body.md
          fail_on_unmatched_files: true
          files: |
            dist/*.nupkg
            dist/*.zip

      # NuGet.org: not yet. With an API key stored as the NUGET_API_KEY secret this is the step:
      # - name: Push to NuGet.org
      #   run: dotnet nuget push "dist/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
