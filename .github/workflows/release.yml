name: release

# How a release is made (owner, 2026-11-06: by hand, from master only):
#   1. Bump SharpNRIVersion in Directory.Build.props (SharpNRI, SharpNRI.Testing, SharpNRI.Native.Upscalers
#      and SharpNRI.AgilitySDK take it), and SharpNRIDescsVersion only when the descs changed since the
#      published one (tools/ci/descs-version.ps1 fails otherwise; an unchanged one is reused). Add
#      docs/releases/v<Version>.md: ## Added, ## Fixed, ## Breaking changes, ## Verified (hardware, commit,
#      coverage link), compact lists of what happened; tools/ci/release-body.ps1 adds Bound libraries
#      and Packages. Merge to master; master's ci goes green.
#   2. Actions > release > Run workflow, on master. Nothing else starts it: no tag push, no merge.
#   3. This workflow: version (all four csprojs agree on <Version>, v<Version> is not a tag yet,
#      the notes exist, the run is on master) -> win-x64, linux-x64 (native payloads, same setup and
#      build-native.ps1 calls as ci.yml) -> pack (one set of .nupkg files, contents listed and
#      checked) -> consume (tools/consume restores the packages from a folder feed and creates
#      devices on windows and ubuntu) -> release (creates the tag v<Version> on the run's commit and
#      the GitHub release with the .nupkg files and one zip per native payload; prerelease when the
#      version contains '-') -> nuget (the same .nupkg files to NuGet.org, Trusted Publishing, after
#      the owner approves the nuget environment). Nothing waits for macOS: osx-arm64 runs after the
#      release and attaches its zip when a runner turns up.
#   A run that fails before the release job publishes nothing and creates no tag: fix through a pull
#   request and run again, or "Re-run failed jobs" when the cause was outside the repository.
#   Dry run (the dry_run input, any branch): only to try a change to this file. It builds, packs,
#   runs consume, uploads artifacts and creates no tag, release or NuGet push.
#   A version on NuGet.org is permanent: a failure after the nuget job means a new version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, pack and consume only; no tag, release or NuGet push (any branch)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # Fails in seconds, before the native builds: package versions that disagree, missing notes, a
  # version already tagged, or a real run anywhere but master.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      agility: ${{ steps.check.outputs.agility }}
      descs_version: ${{ steps.descs.outputs.descs_version }}
      descs_publish: ${{ steps.descs.outputs.descs_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # descs-version.ps1 diffs against the commit the published SharpNRI.Descs came from

      # Versions live in Directory.Build.props (AGENTS.md: Versions): SharpNRIVersion for the release
      # packages, SharpNRIDescsVersion for SharpNRI.Descs. Each project must take its property.
      - name: Version, tag and branch
        id: check
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<SharpNRIVersion>([^<]+)</SharpNRIVersion>') { throw "SharpNRIVersion not found in Directory.Build.props" }
          $version = $Matches[1].Trim()
          if ($props -notmatch '<AgilitySdkVersion>([^<]+)</AgilitySdkVersion>') { throw "AgilitySdkVersion not found in Directory.Build.props" }
          $agility = $Matches[1].Trim()
          $projects = [ordered]@{
            "dotnet/SharpNRI.csproj" = '$(SharpNRIVersion)'; "testing/SharpNRI.Testing.csproj" = '$(SharpNRIVersion)'
            "native/SharpNRI.Native.Upscalers.csproj" = '$(SharpNRIVersion)'; "agility/SharpNRI.AgilitySDK.csproj" = '$(SharpNRIVersion)'
            "descs/SharpNRI.Descs.csproj" = '$(SharpNRIDescsVersion)'
          }
          foreach ($p in $projects.Keys) {
            if ((Get-Content $p -Raw) -notmatch '<Version>([^<]+)</Version>') { throw "<Version> not found in $p" }
            if ($Matches[1].Trim() -ne $projects[$p]) { throw "$p has <Version>$($Matches[1])</Version>, expected $($projects[$p]) (Directory.Build.props)" }
          }
          $tag = "v$version"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { throw "release notes $notes missing: add them in the version-bump pull request" }
          if ($env:DRY_RUN -ne 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/master') { throw "a release runs on master only, not $env:GITHUB_REF (a dry run may run anywhere)" }
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "$tag exists already: bump <Version> for a new release" }
            $global:LASTEXITCODE = 0   # ls-remote exits 2 for a missing tag, the good case; a pwsh step ends with that code
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "agility=$agility" >> $env:GITHUB_OUTPUT
          Write-Host "release $tag, packages $version, Agility SDK $agility$(if ($env:DRY_RUN -eq 'true') { ' (dry run)' })"

      # New SharpNRI.Descs version: published by this release. Published one: unchanged since, and reused.
      - name: SharpNRI.Descs version
        id: descs
        shell: pwsh
        run: ./tools/ci/descs-version.ps1

  # Base + Upscalers. The Agility runtime build-native.ps1 also stages is for the repository's tests
  # only: no package or zip carries it (applications take Microsoft.Direct3D.D3D12).
  win-x64:
    needs: version
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies (Base)
        uses: actions/cache@v4
        with:
          path: _build/win-x64-base/_deps
          key: nri-deps-win-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Cache NRI dependencies (Upscalers)
        uses: actions/cache@v4
        with:
          path: _build/win-x64-upscalers/_deps
          key: nri-deps-win-x64-upscalers-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload (Base)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Configuration Release

      - name: Build native payload (Upscalers)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid win-x64 -Variant Upscalers -Configuration Release

      - name: Zip payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($v in @(@{ Name = "base"; Dir = "runtimes" }, @{ Name = "upscalers"; Dir = "runtimes-upscalers" })) {
            $src = "$($v.Dir)/win-x64/native"
            if (-not (Test-Path $src)) { throw "$src was not staged" }
            # ZipFile writes '/' separators; the zip unpacks the same on every OS.
            [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $src).Path, "$PWD/dist/SharpNRI-native-$($v.Name)-win-x64-$env:RELEASE_TAG.zip")

            # NRI's native symbols, for stepping into NRI and for reading crash dumps of this build:
            # the PDB the same link wrote beside the staged NRI.dll, which names it in its debug directory
            $bin = "_build/win-x64-$($v.Name)/bin/Release"
            $pdb = Join-Path $bin "NRI.pdb"
            if (-not (Test-Path $pdb)) { throw "$pdb was not built" }
            $pe = [System.Reflection.PortableExecutable.PEReader]::new([System.IO.File]::OpenRead((Resolve-Path "$src/NRI.dll").Path))
            try {
              $codeView = $pe.ReadDebugDirectory() | Where-Object Type -eq CodeView | Select-Object -First 1
              $named = $pe.ReadCodeViewDebugDirectoryData($codeView).Path
            } finally { $pe.Dispose() }
            if ((Split-Path $named -Leaf) -ne "NRI.pdb") { throw "the staged NRI.dll names $named, not NRI.pdb" }
            if ((Get-FileHash "$src/NRI.dll").Hash -ne (Get-FileHash (Join-Path $bin "NRI.dll")).Hash) { throw "the staged NRI.dll is not the one beside $pdb" }
            $symbols = "$PWD/dist/SharpNRI-symbols-$($v.Name)-win-x64-$env:RELEASE_TAG.zip"
            $zip = [System.IO.Compression.ZipFile]::Open($symbols, "Create")
            try { [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, (Resolve-Path $pdb).Path, "NRI.pdb") | Out-Null } finally { $zip.Dispose() }
          }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-win-x64
          path: runtimes/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-upscalers-win-x64
          path: runtimes-upscalers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zips-win-x64
          path: dist/*.zip
          if-no-files-found: error

  # Base + Upscalers. On Linux the Upscalers variant is NIS only: FFX and XeSS are Windows-only in
  # NRI, NGX is off without -WithDlss (build-native.ps1).
  linux-x64:
    needs: version
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    # Pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19, and libNRI.so built there would need
    # its newer glibc, silently dropping every older distribution. Raising the floor is a decision.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The build packages of ci.yml's "Install build packages", installed the same way (lists
      # refreshed only after a failed install). libx11-dev / libwayland-dev decide NRI's X11 /
      # Wayland swapchain paths, so the release payload is the one CI tested. No test packages: this
      # job runs no tests.
      - name: Install build packages
        run: |
          apt_install() {
            sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" ||
              { sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
                sudo apt-get install -y -qq --no-install-recommends "$@"; }
          }
          apt_install ninja-build clang libx11-dev libwayland-dev

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies (Base)
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-base/_deps
          key: nri-deps-linux-x64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - name: Cache NRI dependencies (Upscalers)
        uses: actions/cache@v4
        with:
          path: _build/linux-x64-upscalers/_deps
          key: nri-deps-linux-x64-upscalers-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload (Base)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Configuration Release

      - name: Build native payload (Upscalers)
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid linux-x64 -Variant Upscalers -Configuration Release

      # Log only: what the shipped libraries need from the system at load time.
      - name: Library dependencies
        run: |
          for f in runtimes/linux-x64/native/libNRI.so runtimes-upscalers/linux-x64/native/libNRI.so; do
            echo "== $f"
            readelf -d "$f" | grep -E "NEEDED|SONAME|RUNPATH|RPATH" || true
          done

      - name: Zip payloads
        run: |
          mkdir -p dist
          (cd runtimes/linux-x64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-base-linux-x64-$RELEASE_TAG.zip" .)
          (cd runtimes-upscalers/linux-x64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-upscalers-linux-x64-$RELEASE_TAG.zip" .)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-linux-x64
          path: runtimes/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-upscalers-linux-x64
          path: runtimes-upscalers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: zips-linux-x64
          path: dist/*.zip
          if-no-files-found: error

  # Base only: build-native.ps1 refuses Upscalers on macOS. Metal OFF, loader not linked, deployment
  # target 15.0, all passed by the script; its otool check fails the build on a foreign link.
  # Nothing waits for macOS: hosted macOS arm64 runners are often unavailable for hours. This job
  # runs after the release is published and attaches the osx-arm64 zip to it when a runner turns
  # up; the NuGet packages do not carry the macOS library.
  osx-arm64:
    needs: [version, release]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system packages
        run: brew install ninja molten-vk vulkan-loader vulkan-validationlayers vulkan-tools

      - name: Read NRI pin
        id: pin
        shell: pwsh
        run: |
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<NriVersion>([^<]+)</NriVersion>') { throw "NriVersion not found" }
          "nri=$($Matches[1].Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache NRI dependencies
        uses: actions/cache@v4
        with:
          path: _build/osx-arm64-base/_deps
          key: nri-deps-osx-arm64-base-v${{ steps.pin.outputs.nri }}-${{ hashFiles('patches/**') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build native payload
        shell: pwsh
        run: ./tools/build-native.ps1 -Rid osx-arm64 -Configuration Release

      - name: Zip payload
        run: |
          mkdir -p dist
          (cd runtimes/osx-arm64/native && zip -r -X "$GITHUB_WORKSPACE/dist/SharpNRI-native-base-osx-arm64-$RELEASE_TAG.zip" .)
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # One pack with every RID present. dotnet/SharpNRI.csproj packs runtimes/<host rid>/native through
  # its Content item and every other runtimes/** file through its None item (the host RID excluded),
  # both under runtimes/<rid>/native, so the host OS does not matter. The native/ packaging projects
  # pack runtimes-upscalers/** whole.
  pack:
    needs: [version, win-x64, linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - uses: actions/download-artifact@v4
        with:
          pattern: runtimes-*
          path: _artifacts

      # Artifact runtimes[-upscalers]-<rid> holds <rid>/native/...; it goes back under the
      # staging root it was uploaded from.
      - name: Lay out the staging directories
        shell: pwsh
        run: |
          $rids = "win-x64", "linux-x64", "osx-arm64"
          foreach ($a in Get-ChildItem _artifacts -Directory) {
            $rid = $rids | Where-Object { $a.Name.EndsWith("-$_") } | Select-Object -First 1
            if (-not $rid) { throw "unexpected artifact $($a.Name)" }
            $root = $a.Name.Substring(0, $a.Name.Length - $rid.Length - 1)
            if ($root -notin "runtimes", "runtimes-upscalers") { throw "unexpected artifact $($a.Name)" }
            if (-not (Test-Path "$($a.FullName)/$rid/native")) { throw "$($a.Name) has no $rid/native" }
            New-Item -ItemType Directory -Force $root | Out-Null
            Copy-Item "$($a.FullName)/$rid" $root -Recurse
            Write-Host "$($a.Name) -> $root/$rid/native"
          }
          $expected = "runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so",
                      "runtimes-upscalers/win-x64/native/NRI.dll", "runtimes-upscalers/linux-x64/native/libNRI.so"
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "missing after download: $($missing -join ', ')" }

      - name: Pack
        run: dotnet pack SharpNRI.slnx -c Release -p:ContinuousIntegrationBuild=true -p:PackageOutputPath="$GITHUB_WORKSPACE/nupkg"

      # A SharpNRI.Descs version already on NuGet.org (descs-version.ps1 checked it is unchanged) is
      # the published package, byte for byte: consume tests it, the release attaches it, the push skips it.
      - name: Reuse the published SharpNRI.Descs
        if: needs.version.outputs.descs_publish != 'true'
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.descs_version }}".ToLowerInvariant()
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/sharpnri.descs/$v/sharpnri.descs.$v.nupkg" -OutFile "nupkg/SharpNRI.Descs.${{ needs.version.outputs.descs_version }}.nupkg"
          Write-Host "SharpNRI.Descs $v taken from NuGet.org"

      - name: Package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = "${{ needs.version.outputs.version }}"
          $descs = "${{ needs.version.outputs.descs_version }}"
          $agility = "${{ needs.version.outputs.agility }}"
          $reused = "${{ needs.version.outputs.descs_publish }}" -ne "true"
          $must = @{
            "SharpNRI"                  = "runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so", "lib/net11.0/SharpNRI.dll", "lib/net11.0/SharpNRI.xml", "lib/net11.0/SharpNRI.pdb", "buildTransitive/SharpNRI.targets", "licenses/win-x64/NRI/LICENSE.txt", "licenses/linux-x64/NRI/LICENSE.txt", "README.md"
            "SharpNRI.Descs"            = "lib/net11.0/SharpNRI.Descs.dll", "lib/net11.0/SharpNRI.Descs.xml", "lib/net11.0/SharpNRI.Descs.pdb", "README.md"
            "SharpNRI.Testing"          = "lib/net11.0/SharpNRI.Testing.dll", "lib/net11.0/SharpNRI.Testing.xml", "lib/net11.0/SharpNRI.Testing.pdb", "README.md"
            "SharpNRI.Native.Upscalers" = "runtimes/win-x64/native/NRI.dll", "runtimes/linux-x64/native/libNRI.so", "runtimes/win-x64/upscaler-runtimes.json", "runtimes/linux-x64/upscaler-runtimes.json", "buildTransitive/SharpNRI.Native.Upscalers.targets", "licenses/win-x64/NRI/LICENSE.txt", "licenses/linux-x64/NRI/LICENSE.txt", "README.md"
            "SharpNRI.AgilitySDK"       = "buildTransitive/SharpNRI.AgilitySDK.targets", "buildTransitive/SharpNRI.AgilitySDK.props", "README.md"
          }
          # Exact dependencies ([v], Directory.Build.targets): the packages are built against each other
          $deps = @{
            "SharpNRI"            = @{ "SharpNRI.Descs" = "[$descs]" }
            "SharpNRI.Testing"    = @{ "SharpNRI" = "[$version]" }
            "SharpNRI.AgilitySDK" = @{ "Microsoft.Direct3D.D3D12" = "[$agility]" }
            "SharpNRI.Native.Upscalers" = @{ "SharpNRI" = "[$version]" }
          }
          $failed = @()
          foreach ($id in $must.Keys | Sort-Object) {
            $v = if ($id -eq "SharpNRI.Descs") { $descs } else { $version }
            $pkg = "nupkg/$id.$v.nupkg"
            if (-not (Test-Path $pkg)) { $failed += "$pkg not produced"; continue }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $pkg))
            try {
              $entries = @($zip.Entries | ForEach-Object { $_.FullName })
              Write-Host "`n==> $pkg ($([math]::Round((Get-Item $pkg).Length / 1KB)) KB)"
              $zip.Entries | Sort-Object FullName | ForEach-Object { Write-Host ("    {0,12}  {1}" -f $_.Length, $_.FullName) }
              foreach ($e in $must[$id]) { if ($entries -notcontains $e) { $failed += "$pkg lacks $e" } }
              # nothing but libraries under runtimes/<rid>/native/: NuGet copies those flat (beta.2's licences collided)
              foreach ($e in $entries | Where-Object { $_ -match '^runtimes/[^/]+/native/.+/' }) { $failed += "$pkg has $e in a subfolder of native/" }
              $nuspec = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" } | Select-Object -First 1
              $reader = [System.IO.StreamReader]::new($nuspec.Open()); $text = $reader.ReadToEnd(); $reader.Dispose()
              [xml]$xml = $text
              # Source Link: the package names the commit it was built from (PublishRepositoryUrl); a
              # reused SharpNRI.Descs names the commit it was published from
              if ($id -ne "SharpNRI.Native.Upscalers" -and -not ($id -eq "SharpNRI.Descs" -and $reused)) {
                if ($text -notmatch "<repository [^>]*commit=""${{ github.sha }}""") { $failed += "$pkg does not name commit ${{ github.sha }} in <repository>" }
              }
              foreach ($d in ($deps[$id] ?? @{}).GetEnumerator()) {
                $found = @($xml.package.metadata.dependencies.group.dependency | Where-Object id -eq $d.Key)
                if (-not $found) { $failed += "$pkg does not depend on $($d.Key)" }
                foreach ($f in $found) { if ($f.version -ne $d.Value) { $failed += "$pkg depends on $($d.Key) $($f.version), expected $($d.Value)" } }
              }
              # The description names exactly the platforms whose library is inside (SharpNRIPackageDescription)
              if ($id -eq "SharpNRI") {
                $description = $xml.package.metadata.description
                Write-Host "    description: $description"
                if ($description -notmatch 'Native library inside for: Windows x64, Linux x64\.$') { $failed += "$pkg description does not name exactly Windows x64 and Linux x64: $description" }
              }
            } finally { $zip.Dispose() }
          }
          $expected = $must.Keys | ForEach-Object { "$_.$(if ($_ -eq 'SharpNRI.Descs') { $descs } else { $version }).nupkg" }
          $extra = @(Get-ChildItem nupkg -Filter *.nupkg | Where-Object { $_.Name -notin $expected })
          foreach ($x in $extra) { Write-Warning "unexpected package $($x.Name)" }
          if ($failed) { throw "package check failed:`n  $($failed -join "`n  ")" }

      # What changed in the packages' public API since the previous release on NuGet.org (tools/apidiff):
      # the body's "API changes", mechanical, per package
      - name: API changes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-meta | Out-Null
          ./tools/ci/api-changes.ps1 -New nupkg -Version "${{ needs.version.outputs.version }}" -Out release-meta/api-changes.md

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta/
          if-no-files-found: error

  # The packages as an outside project sees them: tools/consume restores SharpNRI and
  # SharpNRI.Testing from nupkg/ by PackageReference and creates NONE plus a validated GPU device
  # (WARP, lavapipe, MoltenVK) with a buffer and a fence. Only what a consumer needs for a software
  # device is installed; no validation layer, no build tools. The first run is the portable build
  # (runtimes/<rid>/native through the deps.json), the second the RID-specific one (flat copy).
  consume:
    needs: [version, pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SHARPNRI_FEED: ${{ github.workspace }}/nupkg
      SHARPNRI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Vulkan loader + lavapipe (software ICD); lists refreshed only after a failed install, as in ci.yml.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          apt_install() {
            sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" ||
              { sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
                sudo apt-get install -y -qq --no-install-recommends "$@"; }
          }
          apt_install libvulkan1 mesa-vulkan-drivers

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      # bash on every runner, as ci.yml's test steps: the DYLD_* variable reaches dotnet the same way.
      - name: Build the consumer
        shell: bash
        run: |
          ls -l nupkg
          dotnet build tools/consume -c Release -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

      - name: Run (portable build)
        shell: bash
        run: dotnet tools/consume/bin/Release/net11.0/SharpNRI.Consume.dll

      - name: Run (-r ${{ matrix.rid }})
        shell: bash
        run: dotnet run --project tools/consume -c Release -r ${{ matrix.rid }} -p:SharpNRIPackageVersion="$SHARPNRI_VERSION"

      # What shipping applications do: a RID-specific publish (beta.2's licences under runtimes/<rid>/native
      # collided there) and Native AOT, each run from its publish directory.
      - name: Publish -r ${{ matrix.rid }} and run
        shell: bash
        run: |
          dotnet publish tools/consume -c Release -r ${{ matrix.rid }} -p:SharpNRIPackageVersion="$SHARPNRI_VERSION" -o "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/publish/SharpNRI.Consume"

      - name: Install the Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq --no-install-recommends clang zlib1g-dev ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang zlib1g-dev; }

      - name: Native AOT publish and run
        shell: bash
        run: |
          dotnet publish tools/consume -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:SharpNRIPackageVersion="$SHARPNRI_VERSION" -o "$RUNNER_TEMP/aot"
          "$RUNNER_TEMP/aot/SharpNRI.Consume"

      # SharpNRI.Native.Upscalers alone (no ExcludeAssets on SharpNRI): its NRI library must be the one
      # loaded (Program.cs checks IsUpscalerSupported(NIS)), portable and published
      - name: Upscalers package alone
        shell: bash
        run: |
          dotnet publish tools/consume -c Release -p:SharpNRIConsumeUpscalers=true -p:SharpNRIPackageVersion="$SHARPNRI_VERSION" -o "$RUNNER_TEMP/upscalers"
          dotnet "$RUNNER_TEMP/upscalers/SharpNRI.Consume.dll"
          dotnet publish tools/consume -c Release -r ${{ matrix.rid }} -p:SharpNRIConsumeUpscalers=true -p:SharpNRIPackageVersion="$SHARPNRI_VERSION" -o "$RUNNER_TEMP/upscalers-rid"
          "$RUNNER_TEMP/upscalers-rid/SharpNRI.Consume"

      # SharpNRI.AgilitySDK turns a Microsoft.Direct3D.D3D12 of another version into a build error
      # (SHARPNRI011) instead of INVALID_SDK at run time. Last: it restores the consumer differently.
      - name: Another Agility SDK version fails the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = dotnet build tools/consume -c Release -p:SharpNRIPackageVersion="$env:SHARPNRI_VERSION" -p:SharpNRIAgilityOverride=1.619.6 -o "$env:RUNNER_TEMP/agility-mismatch" 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log -split "`n" | Select-String 'SHARPNRI01|error' | Select-Object -First 5 | ForEach-Object { Write-Host $_.Line }
          if ($code -eq 0) { throw "the build with Microsoft.Direct3D.D3D12 1.619.6 succeeded" }
          if ($log -notmatch 'SHARPNRI011') { throw "the build failed, but not with SHARPNRI011" }
          $global:LASTEXITCODE = 0

  release:
    needs: [version, pack, consume]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/master' }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/releases
            tools/ci

      # The vendor runtimes the Upscalers payload was built against, from the manifest
      # tools/build-native.ps1 wrote beside it (the package carries the same file)
      - uses: actions/download-artifact@v4
        with:
          name: runtimes-upscalers-win-x64
          path: upscalers

      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release-meta

      # Bound libraries (from the manifest), docs/releases/<tag>.md, API changes (the pack job's), Downloads
      - name: Release body
        shell: pwsh
        run: ./tools/ci/release-body.ps1 -Tag $env:RELEASE_TAG -Manifest upscalers/win-x64/upscaler-runtimes.json -DescsVersion "${{ needs.version.outputs.descs_version }}" -AgilitySdk "${{ needs.version.outputs.agility }}" -ApiChanges release-meta/api-changes.md -Out body.md

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: zips-*
          path: dist
          merge-multiple: true

      - name: Release assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}   # the tag is created here, on the run's commit
          name: SharpNRI ${{ needs.version.outputs.tag }}
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          body_path: body.md
          fail_on_unmatched_files: true
          files: |
            dist/*.nupkg
            dist/*.zip

  # NuGet.org, after the GitHub release, from the same nupkg artifact. Trusted Publishing: no stored
  # key; NuGet/login exchanges this job's GitHub OIDC token for an API key valid one hour, accepted
  # because the owner's nuget.org policy names this repository, release.yml and the nuget
  # environment. NUGET_USER (a repository variable) is the nuget.org account; without it the job
  # skips. A version on NuGet.org is permanent (unlisting hides it, nothing deletes it); the nuget
  # environment can require the owner's approval before the push.
  nuget:
    needs: [version, release]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/master' && vars.NUGET_USER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: dist

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
